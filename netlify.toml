# Netlify Functions (серверна частина — кешування даних доставки Нової пошти)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Чисті URL для сторінки товару: /product/АРТИКУЛ замість /product.html?id=АРТИКУЛ
[[redirects]]
  from = "/product/:id"
  to = "/product.html?id=:id"
  status = 200

# Чистий URL для оформлення замовлення: /checkout замість /checkout.html
[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

# Чистий URL для каталогу: /catalog замість /catalog.html
[[redirects]]
  from = "/catalog"
  to = "/catalog.html"
  status = 200

# Чистий URL для сторінки результату оплати: /order-status замість /order-status.html
[[redirects]]
  from = "/order-status"
  to = "/order-status.html"
  status = 200

# --- Заголовки безпеки (архітектурний опис, розділ 8.3) ---
# Базові заголовки для всього сайту.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Сторінки, залучені в оплату: строгий CSP (SAQ A — картка вводиться лише на hosted-сторінці
# Mono, тож наші сторінки не повинні виконувати сторонні скрипти) і заборона вбудовування
# у чужий iframe (захист від clickjacking).
[[headers]]
  for = "/checkout.html"
  [headers.values]
    # checkout.html підключає script.js (спільний з каталогом/адмінкою), а той тягне Firebase
    # SDK напряму з www.gstatic.com та App Check із ReCaptchaEnterpriseProvider (скрипти й
    # iframe з www.google.com / www.gstatic.com, виклики на securetoken/www.googleapis.com).
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.googletagmanager.com https://connect.facebook.net https://www.gstatic.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://www.google.com https://www.gstatic.com https://firebaseappcheck.googleapis.com https://www.google-analytics.com; frame-src 'self' https://www.google.com https://www.gstatic.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/order-status.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://firestore.googleapis.com https://www.google-analytics.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

# /admin -> /admin.html, щоб заголовки безпеки нижче діяли й на короткому URL.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 301

# --- Адмін-панель: найстрогіший CSP на сайті ---
# Тут живе ID-токен адміна, яким викликаються повернення коштів і посилання на оплату,
# тож будь-яке виконання чужого скрипта на цій сторінці = крадіжка сесії.
# Політика побудована від default-src 'none': дозволено лише те, що адмінка реально використовує.
#  - script-src БЕЗ 'unsafe-inline': у admin.html і в розмітці script.js немає inline-обробників
#    (кнопки працюють через data-action / делегування). Дозволені лише наш script.js та
#    конкретні шляхи Firebase SDK і reCAPTCHA Enterprise (а не цілі домени google/gstatic —
#    www.google.com як хост має відомі JSONP-вектори обходу CSP).
#  - style-src 'unsafe-inline' залишено: у розмітці багато style="..."; ризик значно нижчий,
#    ніж для скриптів (вони не виконуються).
#  - analytics.js / Meta Pixel на адмінці навмисно відсутні й заборонені політикою.
#  - Якщо після змін Firebase SDK у консолі браузера з'являться "Refused to load ...",
#    додайте саме той URL/шлях, який вказано в повідомленні — не послаблюйте політику ширше.
[[headers]]
  for = "/admin.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://www.gstatic.com/firebasejs/ https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://storage.googleapis.com; font-src 'self'; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebasestorage.googleapis.com https://firebaseappcheck.googleapis.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Платіжні функції ніколи не кешуються (окрім Cache-Control: no-store, який ці функції
# v2 вже виставляють самі через lib/http.mjs — цей заголовок додатково покриває
# mono-webhook, що не використовує ту обгортку).
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
