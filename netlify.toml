[build]
  command = "npm install"
# Netlify Functions (серверна частина)
[functions]
  directory = "netlify/functions"
  node_bundler = "nft"
  included_files = ["node_modules/**"]

# Чисті URL для сторінки товару: /product/АРТИКУЛ
[[redirects]]
  from = "/product/:id"
  to = "/product.html?id=:id"
  status = 200

# Чистий URL для оформлення замовлення: /checkout
[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

# Чистий URL для каталогу: /catalog
[[redirects]]
  from = "/catalog"
  to = "/catalog.html"
  status = 200

# Чистий URL для сторінки результату оплати: /order-status
  from = "/order-status"
  to = "/order-status.html"
  status = 200

# --- Заголовки безпеки ---
# Базові заголовки для всього сайту.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Сторінки, залучені в оплату: строгий CSP і заборона вбудовування
# у чужий iframe.
[[headers]]
  for = "/checkout.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.googletagmanager.com https://connect.facebook.net https://www.gstatic.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://www.google.com https://www.gstatic.com https://firebaseappcheck.googleapis.com https://www.google-analytics.com https://bded8a3c6a-1-1053047382554.us-central1.run.app https://www.facebook.com https://connect.facebook.net https://region1.google-analytics.com https://analytics.google.com https://www.googletagmanager.com; frame-src 'self' https://www.google.com https://www.gstatic.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/order-status.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://firestore.googleapis.com https://www.google-analytics.com https://bded8a3c6a-1-1053047382554.us-central1.run.app https://www.facebook.com https://connect.facebook.net https://region1.google-analytics.com https://analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

# /admin -> /admin.html
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 301

# --- Адмін-панель ---
# Політика побудована від default-src 'none': дозволено лише те, що адмінка реально використовує.
#  - script-src БЕЗ 'unsafe-inline': у admin.html і в розмітці script.js немає inline-обробників
#    (кнопки працюють через data-action / делегування). Дозволені лише наш script.js та
#    конкретні шляхи Firebase SDK і reCAPTCHA Enterprise.
[[headers]]
  for = "/admin.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://www.gstatic.com/firebasejs/ https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://storage.googleapis.com; font-src 'self'; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebasestorage.googleapis.com https://firebaseappcheck.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Платіжні функції ніколи не кешуються.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# Статичні зображення сайту (/img/*): кешування в браузері на 24 години + stale-while-revalidate
# ще на 7 днів. БЕЗ immutable
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"